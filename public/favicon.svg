<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Open Book Symbol -->
  <!-- Left Page -->
  <path d="M62 90 C 44 80, 24 86, 20 86 L 20 44 C 24 44, 44 38, 62 48 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  <!-- Left Page Depth -->
  <path d="M62 90 C 44 80, 24 86, 20 86 L 20 92 C 24 92, 44 86, 62 96 Z" fill="#10B981"/>

  <!-- Right Page -->
  <path d="M66 90 C 84 80, 104 86, 108 86 L 108 44 C 104 44, 84 38, 66 48 Z" fill="#F1F5F9" fill-opacity="0.95"/>
  <!-- Right Page Depth -->
  <path d="M66 90 C 84 80, 104 86, 108 86 L 108 92 C 104 92, 84 86, 66 96 Z" fill="#059669"/>

  <!-- Center Spine Bookmark -->
  <path d="M62 45 L 66 45 L 66 102 L 64 99 L 62 102 Z" fill="url(#gold)"/>

  <!-- Wisdom Star / Spark -->
  <g transform="translate(64, 25)" filter="url(#glow)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>
